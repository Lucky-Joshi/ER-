<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNIVERSITY Database — ER Diagram</title>
<style>
  html,body{margin:0;background:#fafaf8;font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;}
  .wrap{padding:24px 24px 60px;}
  h1{font-size:20px;margin:0 0 2px;font-weight:600;}
  .sub{font-size:13px;color:#555;margin-bottom:14px;}
  .scroll{overflow:auto;border:1px solid #ddd;background:#fff;}
  svg{display:block;}
  .legend{margin-top:18px;font-size:12.5px;color:#333;display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid #ddd;padding-top:12px;}
  .legend div{display:flex;align-items:center;gap:8px;}
  .legend svg{width:46px;height:26px;flex:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>UNIVERSITY Database — ER Diagram (Chen Notation)</h1>
  <div class="sub">Exercise 3.16 &nbsp;·&nbsp; scroll / pinch to explore &nbsp;·&nbsp; keys are underlined, dashed underline = partial key</div>
  <div class="scroll" id="host"></div>

  <div class="legend">
    <div><svg viewBox="0 0 46 26"><rect x="2" y="4" width="42" height="18" fill="#fff" stroke="#111" stroke-width="1.6"/></svg> Entity</div>
    <div><svg viewBox="0 0 46 26"><rect x="2" y="4" width="42" height="18" fill="#fff" stroke="#111" stroke-width="1.6"/><rect x="5" y="7" width="36" height="12" fill="none" stroke="#111" stroke-width="1.2"/></svg> Weak entity</div>
    <div><svg viewBox="0 0 46 26"><polygon points="23,3 44,13 23,23 2,13" fill="#fff" stroke="#111" stroke-width="1.6"/></svg> Relationship</div>
    <div><svg viewBox="0 0 46 26"><polygon points="23,3 44,13 23,23 2,13" fill="#fff" stroke="#111" stroke-width="1.6"/><polygon points="23,7 40,13 23,19 6,13" fill="none" stroke="#111" stroke-width="1.1"/></svg> Identifying relationship</div>
    <div><svg viewBox="0 0 46 26"><ellipse cx="23" cy="13" rx="21" ry="10" fill="#fff" stroke="#111" stroke-width="1.4"/></svg> Attribute</div>
    <div><svg viewBox="0 0 46 26"><ellipse cx="23" cy="13" rx="21" ry="10" fill="#fff" stroke="#111" stroke-width="1.4"/><line x1="9" y1="16" x2="37" y2="16" stroke="#111" stroke-width="1.4"/></svg> Key attribute</div>
    <div><svg viewBox="0 0 46 26"><ellipse cx="23" cy="13" rx="21" ry="10" fill="#fff" stroke="#111" stroke-width="1.4"/><line x1="9" y1="16" x2="37" y2="16" stroke="#111" stroke-width="1.4" stroke-dasharray="3,2"/></svg> Partial key</div>
    <div><svg viewBox="0 0 46 26"><line x1="4" y1="13" x2="42" y2="13" stroke="#111" stroke-width="1.4"/></svg> Partial participation</div>
    <div><svg viewBox="0 0 46 26"><line x1="4" y1="10" x2="42" y2="10" stroke="#111" stroke-width="1.4"/><line x1="4" y1="16" x2="42" y2="16" stroke="#111" stroke-width="1.4"/></svg> Total participation</div>
  </div>
</div>

<script>
const W = 2420, H = 1960;
const svgns = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(svgns,"svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width",W); svg.setAttribute("height",H);
document.getElementById("host").appendChild(svg);
document.getElementById("host").style.width = "100%";
document.getElementById("host").style.height = "78vh";

function el(tag, attrs){
  const e = document.createElementNS(svgns, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function text(x,y,str,size=14.5,anchor="middle",weight="normal"){
  const t = el("text",{x,y,"text-anchor":anchor,"font-size":size,"font-family":"Georgia, 'Times New Roman', serif,"});
  t.setAttribute("font-weight",weight);
  t.textContent = str;
  return t;
}

// ---------- connecting line ----------
function line(x1,y1,x2,y2,opts={}){
  const g = el("g",{});
  if(opts.double){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    const ox = -dy/len*3, oy = dx/len*3;
    g.appendChild(el("line",{x1:x1+ox,y1:y1+oy,x2:x2+ox,y2:y2+oy,stroke:"#111","stroke-width":1.6}));
    g.appendChild(el("line",{x1:x1-ox,y1:y1-oy,x2:x2-ox,y2:y2-oy,stroke:"#111","stroke-width":1.6}));
  } else {
    g.appendChild(el("line",{x1,y1,x2,y2,stroke:"#111","stroke-width":1.6}));
  }
  if(opts.label){
    const mx = x1+(x2-x1)*(opts.t??0.5), my = y1+(y2-y1)*(opts.t??0.5);
    g.appendChild(el("rect",{x:mx-13,y:my-12,width:26,height:18,fill:"#fafaf8"}));
    g.appendChild(text(mx,my+2,opts.label,14,"middle","600"));
  }
  svg.appendChild(g);
}

// ---------- entity ----------
function entity(cx,cy,label,opts={}){
  const w = opts.w||190, h = opts.h||58;
  svg.appendChild(el("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,fill:"#fff",stroke:"#111","stroke-width":2}));
  if(opts.weak){
    svg.appendChild(el("rect",{x:cx-w/2+6,y:cy-h/2+6,width:w-12,height:h-12,fill:"none",stroke:"#111","stroke-width":1.3}));
  }
  svg.appendChild(text(cx,cy+6,label,16.5,"middle","700"));
  return {cx,cy,w,h};
}

// ---------- relationship diamond ----------
function relationship(cx,cy,label,opts={}){
  const w = opts.w||190, h = opts.h||92;
  const pts = `${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}`;
  svg.appendChild(el("polygon",{points:pts,fill:"#fff",stroke:"#111","stroke-width":2}));
  if(opts.identifying){
    const w2=w-24,h2=h-24;
    const pts2 = `${cx},${cy-h2/2} ${cx+w2/2},${cy} ${cx},${cy+h2/2} ${cx-w2/2},${cy}`;
    svg.appendChild(el("polygon",{points:pts2,fill:"none",stroke:"#111","stroke-width":1.2}));
  }
  const words = label.split(" ");
  if(words.length>1 && label.length>10){
    svg.appendChild(text(cx,cy-2,words.slice(0,Math.ceil(words.length/2)).join(" "),14,"middle","700"));
    svg.appendChild(text(cx,cy+15,words.slice(Math.ceil(words.length/2)).join(" "),14,"middle","700"));
  } else {
    svg.appendChild(text(cx,cy+5,label,14.5,"middle","700"));
  }
  return {cx,cy,w,h};
}

// ---------- attribute ellipse ----------
function attribute(cx,cy,label,opts={}){
  const rx = opts.rx || Math.max(55, label.length*5.6), ry = opts.ry||27;
  svg.appendChild(el("ellipse",{cx,cy,rx,ry,fill:"#fff",stroke:"#111","stroke-width":1.5}));
  svg.appendChild(text(cx,cy+5,label,13.3));
  if(opts.key || opts.partialKey){
    const tw = Math.min(rx*1.7, label.length*7.2);
    svg.appendChild(el("line",{x1:cx-tw/2,y1:cy+10,x2:cx+tw/2,y2:cy+10,stroke:"#111","stroke-width":1.4,"stroke-dasharray": opts.partialKey?"3,2":"none"}));
  }
  return {cx,cy,rx,ry};
}
// connector from attribute to its owner (entity/relationship/composite center)
function attrLink(ax,ay,ox,oy){
  svg.appendChild(el("line",{x1:ax,y1:ay,x2:ox,y2:oy,stroke:"#111","stroke-width":1.3}));
}

/* ============ ENTITIES ============ */
const DEPT   = entity(300, 980, "DEPARTMENT");
const STUD   = entity(1150, 560, "STUDENT", {w:180});
const COURSE = entity(1150, 1680, "COURSE", {w:180});
const SECTION= entity(2120, 1680, "SECTION", {w:190, weak:true});

/* ============ RELATIONSHIPS ============ */
const MAJORS = relationship(700, 700, "MAJORS_IN");
const MINORS = relationship(700, 920, "MINORS_IN");
const OFFERS = relationship(700, 1330, "OFFERS");
const HASSEC = relationship(1640, 1680, "HAS_SECTIONS", {identifying:true});
const TAKES  = relationship(1750, 1080, "TAKES\n(Grade Report)", {w:210,h:110});
// fix TAKES label manually (two lines, custom)
(function(){ /* overwrite label text added by relationship() with grade-report specific lines already handled by split */ })();

/* ============ LINKS: entity <-> relationship, with cardinality + participation ============ */
// DEPARTMENT -> MAJORS_IN (1 side, partial)
line(DEPT.cx+DEPT.w/2, DEPT.cy-40, MAJORS.cx-MAJORS.w/2, MAJORS.cy+18, {label:"1", t:0.28});
// MAJORS_IN -> STUDENT (N side, total participation of STUDENT)
line(MAJORS.cx+30, MAJORS.cy-30, STUD.cx-70, STUD.cy+70, {label:"N", t:0.75, double:true});

// DEPARTMENT -> MINORS_IN (1, partial)
line(DEPT.cx+DEPT.w/2, DEPT.cy, MINORS.cx-MINORS.w/2, MINORS.cy, {label:"1", t:0.3});
// MINORS_IN -> STUDENT (N, partial — minor is optional)
line(MINORS.cx+20, MINORS.cy-30, STUD.cx-40, STUD.cy+110, {label:"N", t:0.7});

// DEPARTMENT -> OFFERS (1, partial)
line(DEPT.cx+DEPT.w/2, DEPT.cy+60, OFFERS.cx-OFFERS.w/2, OFFERS.cy-18, {label:"1", t:0.3});
// OFFERS -> COURSE (N, total participation of COURSE)
line(OFFERS.cx+30, OFFERS.cy+30, COURSE.cx-70, COURSE.cy-70, {label:"N", t:0.72, double:true});

// COURSE -> HAS_SECTIONS (1, partial — a course need not yet have sections)
line(COURSE.cx+COURSE.w/2, COURSE.cy, HASSEC.cx-HASSEC.w/2, HASSEC.cy, {label:"1", t:0.32});
// HAS_SECTIONS -> SECTION (N, total — weak entity always total participation)
line(HASSEC.cx+HASSEC.w/2, HASSEC.cy, SECTION.cx-SECTION.w/2, SECTION.cy, {label:"N", t:0.75, double:true});

// STUDENT -> TAKES (M, partial)
line(STUD.cx+60, STUD.cy+29, TAKES.cx-90, TAKES.cy-70, {label:"M", t:0.32});
// TAKES -> SECTION (N, partial)
line(TAKES.cx+70, TAKES.cy+40, SECTION.cx-60, SECTION.cy-90, {label:"N", t:0.72});

/* ============ DEPARTMENT attributes ============ */
[
  {label:"Dept_Name", key:true, x:70, y:730},
  {label:"Dept_Code", key:true, x:55, y:850},
  {label:"Office_Number", x:55, y:970},
  {label:"Office_Phone", x:70, y:1090},
  {label:"College", x:110, y:1200},
].forEach(a=>{
  attribute(a.x,a.y,a.label,{key:a.key});
  attrLink(a.x,a.y+ (a.y<DEPT.cy?27:-27), DEPT.cx-DEPT.w/2, DEPT.cy + (a.y<DEPT.cy?-15:15));
});

/* ============ COURSE attributes ============ */
[
  {label:"Course_Name", x:560, y:1560},
  {label:"Description", x:610, y:1700},
  {label:"Course_Number", key:true, x:560, y:1840},
  {label:"Semester_Hours", x:820, y:1880},
  {label:"Level", x:1020, y:1880},
].forEach(a=>{
  attribute(a.x,a.y,a.label,{key:a.key});
  attrLink(a.x,a.y,COURSE.cx-30,COURSE.cy+ (a.y>COURSE.cy?29:-29));
});

/* ============ SECTION attributes ============ */
[
  {label:"Section_Number", partialKey:true, x:1980, y:1880},
  {label:"Semester", x:2160, y:1880},
  {label:"Year", x:2320, y:1840},
  {label:"Instructor", x:2340, y:1700},
].forEach(a=>{
  attribute(a.x,a.y,a.label,{partialKey:a.partialKey});
  attrLink(a.x,a.y,SECTION.cx+30,SECTION.cy+29);
});

/* ============ TAKES (grade report) attributes ============ */
[
  {label:"Letter_Grade", x:2040, y:960},
  {label:"Numeric_Grade", x:2060, y:1180},
].forEach(a=>{
  attribute(a.x,a.y,a.label);
  attrLink(a.x,a.y,TAKES.cx+50,TAKES.cy+(a.y<TAKES.cy?-30:30));
});

/* ============ STUDENT attributes (with composites) ============ */
// simple top-level attrs
const studentSimple = [
  {label:"Student_Number", key:true, x:480, y:300},
  {label:"SSN", key:true, x:650, y:300},
  {label:"Current_Phone", x:1050, y:300},
  {label:"Permanent_Phone", x:1450, y:300},
  {label:"Birth_Date", x:1600, y:300},
  {label:"Sex", x:1730, y:300},
  {label:"Class", x:1850, y:300},
  {label:"Degree_Program", x:2020, y:300},
];
studentSimple.forEach(a=>{
  attribute(a.x,a.y,a.label,{key:a.key});
  attrLink(a.x, a.y+27, STUD.cx, STUD.cy-29);
});

// composite: Name -> First, Middle, Last
const nameC = attribute(300, 300, "Name", {rx:60});
attrLink(300,327, STUD.cx, STUD.cy-29);
[{l:"First_Name",x:210},{l:"Middle_Name",x:300},{l:"Last_Name",x:390}].forEach(c=>{
  attribute(c.x,120,c.l,{rx:64});
  attrLink(c.x,147,300,273);
});

// composite: Current_Address -> Street, City, State, Zip
const curAddrC = attribute(830, 300, "Current_Address", {rx:82});
attrLink(830,327, STUD.cx, STUD.cy-29);
[{l:"Street",x:720},{l:"City",x:800},{l:"State",x:875},{l:"Zip",x:945}].forEach(c=>{
  attribute(c.x,120,c.l,{rx:50});
  attrLink(c.x,147,830,273);
});

// composite: Permanent_Address -> Street, City, State, Zip
const permAddrC = attribute(1230, 300, "Permanent_Address", {rx:88});
attrLink(1230,327, STUD.cx, STUD.cy-29);
[{l:"Street",x:1115},{l:"City",x:1195},{l:"State",x:1270},{l:"Zip",x:1345}].forEach(c=>{
  attribute(c.x,120,c.l,{rx:50});
  attrLink(c.x,147,1230,273);
});

// Title
svg.appendChild(text(W/2, 40, "UNIVERSITY  E-R  Diagram", 24, "middle", "700"));
</script>
</body>
</html>
